name: PSOS web prompt modes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/problem_solving_web.py"
      - "scripts/problem_solving_compare_web.py"
      - "scripts/problem_solving_prompt_renderer.py"
      - "configs/psos-goal-aware-assistant-policy.md"
      - "schemas/problem-solving-integrated-prompt-design.schema.json"
      - "web/index.html"
      - "web/app.js"
      - "web/renderer.js"
      - "web/compare-no-codex.js"
      - "web/styles.css"
      - "web/renderer.css"
      - "tests/test_problem_solving_web.py"
      - "tests/test_problem_solving_web_dual_mode.py"
      - "tests/test_problem_solving_compare_web.py"
      - "tests/test_problem_solving_prompt_renderer.py"
      - "docs/psos-web-dual-mode.md"
      - "start-psos-compare.cmd"
      - ".github/workflows/psos-web-dual-mode.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile servers and renderer
        run: |
          python -m py_compile scripts/problem_solving_web.py
          python -m py_compile scripts/problem_solving_compare_web.py
          python -m py_compile scripts/problem_solving_prompt_renderer.py
      - name: Validate integrated design schema
        run: python -m json.tool schemas/problem-solving-integrated-prompt-design.schema.json > /dev/null
      - name: Check browser scripts
        run: |
          node --check web/app.js
          node --check web/renderer.js
          node --check web/compare-no-codex.js
      - name: Run web and renderer tests
        run: >-
          python -B -m unittest
          tests.test_problem_solving_web
          tests.test_problem_solving_web_dual_mode
          tests.test_problem_solving_compare_web
          tests.test_problem_solving_prompt_renderer
