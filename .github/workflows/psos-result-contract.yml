name: PSOS result contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/problem_solving_contract.py"
      - "scripts/problem_solving_contract_enforcement.py"
      - "scripts/problem_solving_core_semantic_fixes.py"
      - "scripts/problem_solving_quality_semantic_fixes.py"
      - "scripts/problem_solving_evidence_bundle.py"
      - "scripts/problem_solving_evidence_review.py"
      - "scripts/problem_solving_visual_evidence.py"
      - "scripts/problem_solving_prompt_trace.py"
      - "scripts/problem_solving_os_contract_runtime.py"
      - "scripts/problem_solving_os_quality_runtime.py"
      - "scripts/problem_solving_quality_web.py"
      - "scripts/problem_solving_web.py"
      - "scripts/problem_solving_os.py"
      - "schemas/problem-solving-os-route.schema.json"
      - "schemas/problem-solving-os-result-contract.schema.json"
      - "schemas/problem-solving-os-result-contract-assessment.schema.json"
      - "schemas/problem-solving-os-evidence-bundle.schema.json"
      - "schemas/problem-solving-os-evidence-review.schema.json"
      - "schemas/problem-solving-os-visual-evidence-import.schema.json"
      - "tests/test_problem_solving_core_semantic_fixes.py"
      - "tests/test_problem_solving_quality_semantic_fixes.py"
      - "tests/test_problem_solving_contract.py"
      - "tests/test_problem_solving_contract_enforcement.py"
      - "tests/test_problem_solving_evidence_bundle.py"
      - "tests/test_problem_solving_evidence_review.py"
      - "tests/test_problem_solving_visual_evidence.py"
      - "tests/test_problem_solving_prompt_trace.py"
      - "tests/test_problem_solving_os_contract_runtime.py"
      - "tests/test_problem_solving_os_quality_runtime.py"
      - "tests/test_problem_solving_quality_web.py"
      - "tests/test_problem_solving_web.py"
      - "tests/test_problem_solving_os.py"
      - "tests/fixtures/result-contract-cases.json"
      - "web/quality-review.js"
      - "web/quality-review.css"
      - "extensions/psos-visual-evidence/**"
      - ".github/workflows/psos-result-contract.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/problem_solving_contract.py"
      - "scripts/problem_solving_contract_enforcement.py"
      - "scripts/problem_solving_core_semantic_fixes.py"
      - "scripts/problem_solving_quality_semantic_fixes.py"
      - "scripts/problem_solving_evidence_bundle.py"
      - "scripts/problem_solving_evidence_review.py"
      - "scripts/problem_solving_visual_evidence.py"
      - "scripts/problem_solving_prompt_trace.py"
      - "scripts/problem_solving_os_contract_runtime.py"
      - "scripts/problem_solving_os_quality_runtime.py"
      - "scripts/problem_solving_quality_web.py"
      - "scripts/problem_solving_web.py"
      - "scripts/problem_solving_os.py"
      - "schemas/problem-solving-os-route.schema.json"
      - "schemas/problem-solving-os-result-contract.schema.json"
      - "schemas/problem-solving-os-result-contract-assessment.schema.json"
      - "schemas/problem-solving-os-evidence-bundle.schema.json"
      - "schemas/problem-solving-os-evidence-review.schema.json"
      - "schemas/problem-solving-os-visual-evidence-import.schema.json"
      - "tests/test_problem_solving_core_semantic_fixes.py"
      - "tests/test_problem_solving_quality_semantic_fixes.py"
      - "tests/test_problem_solving_contract.py"
      - "tests/test_problem_solving_contract_enforcement.py"
      - "tests/test_problem_solving_evidence_bundle.py"
      - "tests/test_problem_solving_evidence_review.py"
      - "tests/test_problem_solving_visual_evidence.py"
      - "tests/test_problem_solving_prompt_trace.py"
      - "tests/test_problem_solving_os_contract_runtime.py"
      - "tests/test_problem_solving_os_quality_runtime.py"
      - "tests/test_problem_solving_quality_web.py"
      - "tests/test_problem_solving_web.py"
      - "tests/test_problem_solving_os.py"
      - "tests/fixtures/result-contract-cases.json"
      - "web/quality-review.js"
      - "web/quality-review.css"
      - "extensions/psos-visual-evidence/**"
      - ".github/workflows/psos-result-contract.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile quality modules
        run: |
          python -m py_compile scripts/problem_solving_contract.py
          python -m py_compile scripts/problem_solving_contract_enforcement.py
          python -m py_compile scripts/problem_solving_core_semantic_fixes.py
          python -m py_compile scripts/problem_solving_quality_semantic_fixes.py
          python -m py_compile scripts/problem_solving_evidence_bundle.py
          python -m py_compile scripts/problem_solving_evidence_review.py
          python -m py_compile scripts/problem_solving_visual_evidence.py
          python -m py_compile scripts/problem_solving_prompt_trace.py
          python -m py_compile scripts/problem_solving_os_contract_runtime.py
          python -m py_compile scripts/problem_solving_os_quality_runtime.py
          python -m py_compile scripts/problem_solving_quality_web.py
      - name: Validate fixture and schema JSON
        run: |
          python -m json.tool tests/fixtures/result-contract-cases.json > /dev/null
          python -m json.tool schemas/problem-solving-os-route.schema.json > /dev/null
          python -m json.tool schemas/problem-solving-os-result-contract.schema.json > /dev/null
          python -m json.tool schemas/problem-solving-os-result-contract-assessment.schema.json > /dev/null
          python -m json.tool schemas/problem-solving-os-evidence-bundle.schema.json > /dev/null
          python -m json.tool schemas/problem-solving-os-evidence-review.schema.json > /dev/null
          python -m json.tool schemas/problem-solving-os-visual-evidence-import.schema.json > /dev/null
          python -m json.tool extensions/psos-visual-evidence/manifest.json > /dev/null
      - name: Check browser scripts
        run: |
          node --check web/app.js
          node --check web/quality-review.js
          node --check extensions/psos-visual-evidence/background.js
          node --check extensions/psos-visual-evidence/content.js
      - name: Run focused quality tests
        run: >-
          python -m unittest
          tests.test_problem_solving_core_semantic_fixes
          tests.test_problem_solving_quality_semantic_fixes
          tests.test_problem_solving_contract
          tests.test_problem_solving_contract_enforcement
          tests.test_problem_solving_evidence_bundle
          tests.test_problem_solving_evidence_review
          tests.test_problem_solving_visual_evidence
          tests.test_problem_solving_prompt_trace
          tests.test_problem_solving_os_contract_runtime
          tests.test_problem_solving_os_quality_runtime
          tests.test_problem_solving_quality_web
          tests.test_problem_solving_web
      - name: Run canonical PSOS regression suite
        run: python -m unittest tests.test_problem_solving_os
