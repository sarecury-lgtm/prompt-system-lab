name: PSOS result contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/problem_solving_contract.py"
      - "schemas/problem-solving-os-result-contract.schema.json"
      - "tests/test_problem_solving_contract.py"
      - "tests/fixtures/result-contract-cases.json"
      - ".github/workflows/psos-result-contract.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/problem_solving_contract.py"
      - "schemas/problem-solving-os-result-contract.schema.json"
      - "tests/test_problem_solving_contract.py"
      - "tests/fixtures/result-contract-cases.json"
      - ".github/workflows/psos-result-contract.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile contract module
        run: python -m py_compile scripts/problem_solving_contract.py
      - name: Validate fixture JSON
        run: python -m json.tool tests/fixtures/result-contract-cases.json > /dev/null
      - name: Run focused contract tests
        run: python -m unittest tests.test_problem_solving_contract
